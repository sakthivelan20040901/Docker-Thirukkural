<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Thirukkural Chatbot</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#f7c873,#d97706);
}

.header {
    padding:10px;
    text-align:center;
    background:#fff3cd;
}

.controls {
    display:flex;
    justify-content:space-between;
    padding:10px;
}

.chat {
    height:70vh;
    overflow-y:auto;
    padding:10px;
}

.user { text-align:right; margin:10px; }
.bot { text-align:left; margin:10px; }

.bubble {
    display:inline-block;
    padding:10px;
    border-radius:10px;
    max-width:70%;
}

.user .bubble { background:#ff8c00; color:white; }
.bot .bubble { background:#fff3cd; }

.more { display:none; }

input {
    width:80%;
    padding:10px;
}
button { padding:10px; cursor:pointer; }
</style>
</head>

<body>

<div class="header">📜 Thirukkural Chatbot</div>

<div class="controls">
<form action="/clear_history" method="post">
<button>🧹 Clear</button>
</form>

<a href="/export_history"><button>📤 JSON</button></a>
<a href="/export_pdf"><button>📄 PDF</button></a>
</div>

<div class="chat" id="chat">
{% for item in history %}

<div class="user">
<div class="bubble">{{item.query}}</div>
</div>

<div class="bot">
<div class="bubble">
<b>#{{item.verse_number}}</b><br>
{{item.tamil}}<br>
{{item.english}}

<br>
<button onclick="toggle(this)">Show More</button>

<div class="more">
<br>{{item.tamil_explanation}}<br>
{{item.english_explanation}}
</div>

</div>
</div>

{% endfor %}
</div>

<form action="/get_verse" method="post">
<input name="query" placeholder="Type..." required>
<button>Send</button>
</form>

<script>
function toggle(btn){
let m = btn.nextElementSibling;
m.style.display = m.style.display=="block"?"none":"block";
}

window.onload = ()=>{
let c=document.getElementById("chat");
c.scrollTop=c.scrollHeight;
}
</script>

</body>
</html>
